name: Release delivery

# Livraison complémentaire à cargo-dist (T1.25) : image multi-arch, binaires bruts pour le
# lanceur npx, signatures cosign et SBOM. Déclenchée quand cargo-dist a publié la release.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    name: container (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign the image (keyless)
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: SBOM for the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          artifact-name: buntu-container-${{ github.event.release.tag_name }}.spdx.json
          output-file: buntu-container.spdx.json

      - name: Attach the image SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" buntu-container.spdx.json sbom-action-* --clobber

  binaries:
    name: raw binaries + signatures (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the embedded console
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build the release binary
        shell: bash
        run: |
          cargo build --release --locked -p buntu-cli --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/buntu"
          if [[ "${{ matrix.target }}" == *windows* ]]; then binary="${binary}.exe"; fi
          asset="buntu-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then asset="${asset}.exe"; fi
          cp "$binary" "$asset"
          sha256sum "$asset" > "$asset.sha256" || shasum -a 256 "$asset" > "$asset.sha256"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Attach the raw binary to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${ASSET}" "${ASSET}.sha256" --clobber

  smoke:
    name: smoke test (published linux binary)
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the published binary and its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release download "$tag" --pattern 'buntu-x86_64-unknown-linux-musl' --pattern 'buntu-x86_64-unknown-linux-musl.sha256' --dir .
          sha256sum -c buntu-x86_64-unknown-linux-musl.sha256
          chmod +x buntu-x86_64-unknown-linux-musl
          ./buntu-x86_64-unknown-linux-musl --version

      - name: Start the gateway and hit /ready
        run: |
          ./buntu-x86_64-unknown-linux-musl serve --listen 127.0.0.1:18080 &
          for _ in $(seq 1 100); do
            if curl -sf http://127.0.0.1:18080/ready >/dev/null; then break; fi
            sleep 0.2
          done
          curl -sf http://127.0.0.1:18080/ready

      - name: Sign the checksums (keyless)
        uses: sigstore/cosign-installer@v3.8.1
      - name: cosign sign-blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          tag="${{ github.event.release.tag_name }}"
          tokens=$(gh release view "$tag" --json assets --jq '.assets[].name | select(endswith(".sha256"))')
          for name in $tokens; do
            cosign sign-blob --yes --bundle "${name}.sigstore.json" "${name}"
            gh release upload "$tag" "${name}.sigstore.json" --clobber
          done

  npm:
    name: publish the npx launcher
    needs: [binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Align the package version with the release
        working-directory: npx
        run: npm version --no-git-tag-version "${{ github.event.release.tag_name }}"

      - name: Test the launcher
        working-directory: npx
        run: npm test

      - name: Publish with provenance
        if: ${{ secrets.NPM_TOKEN != '' }}
        working-directory: npx
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
