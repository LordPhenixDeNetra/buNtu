name: Release delivery

# Livraison complémentaire à cargo-dist (T1.25) : image multi-arch, binaires bruts pour le
# lanceur npx, signatures cosign et SBOM.
#
# Déclenchement : workflow_run à la fin du workflow « Release ». Un déclenchement direct sur
# l'événement `release: published` ne fonctionne pas ici, car la release est créée par
# GITHUB_TOKEN (les événements produits par GITHUB_TOKEN ne démarrent pas de nouveau workflow).
# `workflow_dispatch` permet de rattraper une release existante (rétro-remplissage).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deliver (e.g. v0.0.1-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    name: container (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Ce workflow ne tourne pas sur l'événement « push de tag » : `type=semver` ne lit pas
          # le tag tout seul, il faut lui passer `value` (README de docker/metadata-action,
          # section `type=semver`, consultée le 2026-11-08). Une pré-release ne reçoit que
          # `{{version}}` ; `latest` est réservé aux versions finales.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.event.workflow_run.head_branch }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.event.workflow_run.head_branch }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.event.workflow_run.head_branch }}
            type=raw,value=${{ inputs.tag || github.event.workflow_run.head_branch }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.event.workflow_run.head_branch, '-') }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Compute the lowercase image path
        id: image
        run: echo "path=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Sign the image (keyless)
        run: |
          cosign sign --yes \
            "${REGISTRY}/${{ steps.image.outputs.path }}@${{ steps.build.outputs.digest }}"

      - name: SBOM for the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.image.outputs.path }}@${{ steps.build.outputs.digest }}
          artifact-name: buntu-container-${{ inputs.tag || github.event.workflow_run.head_branch }}.spdx.json
          output-file: buntu-container.spdx.json

      - name: Attach the image SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.event.workflow_run.head_branch }}" buntu-container.spdx.json --clobber

  binaries:
    name: raw binaries + signatures (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # `macos-14` n'est plus fourni par GitHub (« configuration 'macos-14-arm64-us-default'
          # is not supported », livraison v0.1.0) ; `macos-latest` est ARM64, comme en CI.
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the embedded console
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build the release binary
        shell: bash
        run: |
          cargo build --release --locked -p buntu-cli --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/buntu"
          if [[ "${{ matrix.target }}" == *windows* ]]; then binary="${binary}.exe"; fi
          asset="buntu-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then asset="${asset}.exe"; fi
          cp "$binary" "$asset"
          sha256sum "$asset" > "$asset.sha256" || shasum -a 256 "$asset" > "$asset.sha256"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Attach the raw binary to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag || github.event.workflow_run.head_branch }}" "${ASSET}" "${ASSET}.sha256" --clobber

  smoke:
    name: smoke test (published linux binary)
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the published binary and its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.event.workflow_run.head_branch }}"
          gh release download "$tag" --pattern 'buntu-x86_64-unknown-linux-musl' --pattern 'buntu-x86_64-unknown-linux-musl.sha256' --dir .
          sha256sum -c buntu-x86_64-unknown-linux-musl.sha256
          chmod +x buntu-x86_64-unknown-linux-musl
          ./buntu-x86_64-unknown-linux-musl --version

      - name: Start the gateway and hit /ready
        run: |
          ./buntu-x86_64-unknown-linux-musl serve --listen 127.0.0.1:18080 &
          for _ in $(seq 1 100); do
            if curl -sf http://127.0.0.1:18080/ready >/dev/null; then break; fi
            sleep 0.2
          done
          curl -sf http://127.0.0.1:18080/ready

      - name: Sign the checksums (keyless)
        uses: sigstore/cosign-installer@v3.8.1
      - name: cosign sign-blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          tag="${{ inputs.tag || github.event.workflow_run.head_branch }}"
          mkdir -p checksums
          gh release download "$tag" --pattern '*.sha256' --dir checksums
          tokens=$(gh release view "$tag" --json assets --jq '.assets[].name | select(endswith(".sha256"))')
          for name in $tokens; do
            cosign sign-blob --yes --bundle "checksums/${name}.sigstore.json" "checksums/${name}"
          done
          gh release upload "$tag" checksums/*.sigstore.json --clobber

  npm:
    name: publish the npx launcher
    needs: [binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check that every version matches the tag (ADR-0009)
        run: node scripts/release.mjs check "${{ inputs.tag || github.event.workflow_run.head_branch }}"

      - name: Align the package version with the release
        working-directory: npx
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.tag || github.event.workflow_run.head_branch }}"

      - name: Test the launcher
        working-directory: npx
        run: npm test

      - name: Publish with provenance
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: npx
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          npm publish --provenance --access public --tag "$dist_tag"
