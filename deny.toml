[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    # Données Unicode (unicode-ident, icu) : licence permissive, requise par serde_derive.
    "Unicode-3.0",
    # `notify` (surveillance de fichiers, T1.2) est sous CC0-1.0, dédiée au domaine public.
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
