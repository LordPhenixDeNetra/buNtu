# Workspace buNtu — voir AGENTS.md et le cahier des charges §6.2.
[workspace]
resolver = "3"
members = [
    "crates/buntu-schema",
    "crates/buntu-core",
    "crates/buntu-providers",
    "crates/buntu-gateway",
    "crates/buntu-store",
    "crates/buntu-governance",
    "crates/buntu-cache",
    "crates/buntu-mcp",
    "crates/buntu-security",
    "crates/buntu-observe",
    "crates/buntu-plugin-wasm",
    "crates/buntu-cluster",
    "crates/buntu-cli",
    "tools/mock-provider",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/LordPhenixDeNetra/buNtu"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# Crates internes : la version explicite évite que cargo-deny les traite comme des
# dépendances « wildcard » (règle `bans.wildcards`). Elles seront publiées ensemble ensuite.
buntu-schema = { version = "0.0.0", path = "crates/buntu-schema" }
buntu-core = { version = "0.0.0", path = "crates/buntu-core" }
buntu-providers = { version = "0.0.0", path = "crates/buntu-providers" }
buntu-gateway = { version = "0.0.0", path = "crates/buntu-gateway" }
buntu-store = { version = "0.0.0", path = "crates/buntu-store" }
buntu-governance = { version = "0.0.0", path = "crates/buntu-governance" }
buntu-cache = { version = "0.0.0", path = "crates/buntu-cache" }
buntu-mcp = { version = "0.0.0", path = "crates/buntu-mcp" }
buntu-security = { version = "0.0.0", path = "crates/buntu-security" }
buntu-observe = { version = "0.0.0", path = "crates/buntu-observe" }
buntu-plugin-wasm = { version = "0.0.0", path = "crates/buntu-plugin-wasm" }
buntu-cluster = { version = "0.0.0", path = "crates/buntu-cluster" }
buntu-cli = { version = "0.0.0", path = "crates/buntu-cli" }

# Dépendances du simulateur de fournisseur (T0.3) ; aucune crate produit ne les utilise.
async-stream = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Socle produit : serveur HTTP et runtime (T1.1), schéma canonique (T0.5).
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "signal", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["limit"] }

# Schéma canonique (T0.5).
proptest = "1"
thiserror = "2"

# Configuration et rechargement à chaud (T1.2).
arc-swap = "1.9"
notify = "8.2"
toml = "1.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
