# Workspace buNtu — voir AGENTS.md et le cahier des charges §6.2.
[workspace]
resolver = "3"
members = [
    "crates/buntu-schema",
    "crates/buntu-core",
    "crates/buntu-providers",
    "crates/buntu-gateway",
    "crates/buntu-store",
    "crates/buntu-governance",
    "crates/buntu-cache",
    "crates/buntu-mcp",
    "crates/buntu-security",
    "crates/buntu-observe",
    "crates/buntu-plugin-wasm",
    "crates/buntu-cluster",
    "crates/buntu-cli",
    "crates/buntu-conformance",
    "tools/mock-provider",
    "xtask",
]

[workspace.package]
version = "0.0.1-rc.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/LordPhenixDeNetra/buNtu"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# Crates internes : la version explicite évite que cargo-deny les traite comme des
# dépendances « wildcard » (règle `bans.wildcards`). Elles seront publiées ensemble ensuite.
buntu-schema = { version = "0.0.1-rc.1", path = "crates/buntu-schema" }
buntu-core = { version = "0.0.1-rc.1", path = "crates/buntu-core" }
buntu-providers = { version = "0.0.1-rc.1", path = "crates/buntu-providers" }
buntu-gateway = { version = "0.0.1-rc.1", path = "crates/buntu-gateway" }
buntu-store = { version = "0.0.1-rc.1", path = "crates/buntu-store" }
buntu-governance = { version = "0.0.1-rc.1", path = "crates/buntu-governance" }
buntu-cache = { version = "0.0.1-rc.1", path = "crates/buntu-cache" }
buntu-mcp = { version = "0.0.1-rc.1", path = "crates/buntu-mcp" }
buntu-security = { version = "0.0.1-rc.1", path = "crates/buntu-security" }
buntu-observe = { version = "0.0.1-rc.1", path = "crates/buntu-observe" }
buntu-plugin-wasm = { version = "0.0.1-rc.1", path = "crates/buntu-plugin-wasm" }
buntu-cluster = { version = "0.0.1-rc.1", path = "crates/buntu-cluster" }
buntu-cli = { version = "0.0.1-rc.1", path = "crates/buntu-cli" }

# Dépendances du simulateur de fournisseur (T0.3) ; aucune crate produit ne les utilise.
async-stream = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Socle produit : serveur HTTP et runtime (T1.1), schéma canonique (T0.5), client amont (T1.13).
axum = "0.8"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["service", "tokio", "client", "client-legacy", "http1"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "signal", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["limit"] }

# TLS amont (revue 2026-11-05, point 1f) : rustls + racines Mozilla embarquées, fournisseur `ring`.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Schéma canonique (T0.5).
proptest = "1"
thiserror = "2"

# Configuration et rechargement à chaud (T1.2).
arc-swap = "1.9"
notify = "8.2"
toml = "1.1"

# Sélection pondérée des clés (T1.4) ; criterion est réservé aux benchmarks.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
fastrand = "2.5"

# Kit de conformité des fournisseurs (T1.8) : crate de test non publiée uniquement.
wiremock = "0.6"

# Erreurs normalisées (T1.15) : snapshots de tests.
insta = { version = "1", features = ["json"] }

# API d'administration + OpenAPI (T1.16).
utoipa = "6"

# Interface web embarquée (T1.22).
rust-embed = "8"

# Référence de configuration générée (T1.27).
schemars = "1"

# E4 — stockage, journal, métriques et sécurité (T1.17–T1.21).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
argon2 = "0.5"
rand = "0.8"
subtle = "2.6"
sha2 = "0.10"
secrecy = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
